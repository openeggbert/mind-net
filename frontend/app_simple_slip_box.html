<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Slip Box - App (simple)</title>
    <link rel="stylesheet" href="app_simple_slip_box.css">
    <script type="module" src="app_slip_box.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div id="app" data-version="simple"></div>
<div class="container">
    <!-- Navigation -->
    <div class="nav">
        <button onclick="window.location.href='index.html'">Mind Net</button>
        <button id="button_previous">Previous</button>
        <button id="button_next">Next</button>
        <button id="button_theme">Theme</button>
    </div>

    <!-- Parent note -->
    <div class="panel parent" id="parent">


        <div class="panel-header">
        <span class="panel_title">
          <span id="parent_label">Parent</span>
#<span id="parent_id">4688</span>
      <span><a href="#" id="parent_title">Parent note</a></span>
        <button id="parent_button_copy">Copy</button>
        </span>


            <div>
                <button id="parent_button_edit">Edit</button>
            </div>


        </div>
    </div>


    <!-- Note -->
    <div class="panel note" id="current">
        <div class="panel-header">
        <span class="panel_title">
          <span id="current_label">Note</span>
            #<span id="current_id">43453</span>
          <span><a href="#" id="current_title" onclick="note_title_link()">Note title</a></span>
          <button id="current_button_rename">Rename</button>
          <button id="current_button_copy">Copy</button>
        </span>
            <div>
                <button class="toggle_button" id="collapsible-toggle-note-content"
                        onclick="togglePanel(this, 'note-content')">▼ Collapse
                </button>
                <button id="current_button_edit">Edit</button>
                <button id="current_button_read">Read</button>
            </div>
        </div>
        <div>
        </div>
        <div id="note-content" class="collapsible-content">
        <textarea id="current_textarea">
First paragraph of text…
## Related Notes
[[Copy Constructor vs. Move Constructor]]
        </textarea>

        <div class="note-actions">
            <button class="delete" id="current_button_delete">Delete</button>
            <button class="cancel" id="current_button_cancel">Cancel</button>
            <button class="save" id="current_button_save">Save</button>
        </div>
        </div>
    </div>

    <!-- Metadata panel -->
    <div class="panel meta" id="meta">

        <div class="panel-header">
        <span class="panel_title">
          <span id="meta_label">Metadata</span>

        </span>
            <div>
                <button class="toggle_button" id="collapsible-toggle-meta"
                        onclick="togglePanel(this, 'meta_content')">▼ Collapse
                </button>

            </div>
        </div>
        <div id="meta_content" class="collapsible-content">

            <p>
                <b>Order:</b> <span id="meta_order">3400</span>
                <button id="current_button_edit_order">Edit</button>
            </p>

            <p><b>Importance:</b> <span id="meta_importance">High</span>
                <button id="current_button_edit_importance">Edit</button>
            </p>
            <p><b>Difficulty:</b> <span id="meta_difficulty">Expert</span>
                <button id="current_button_edit_difficulty">Edit</button>
            </p>
            <div class="meta-buttons">

                <h3>Knowledge</h3>

                <button id="meta_button_links">Links</button>
                <button id="meta_button_urls">Urls</button>
                <button id="meta_button_terms">Terms</button>
                <button id="meta_button_sources">Sources</button>
                <button id="meta_button_ideas">Ideas</button>
                <button id="meta_button_questions" onclick="showWindow()">Questions</button>


                <h3>Relations</h3>
                <button id="meta_button_backlinks">Backlinks</button>
                <button id="meta_button_siblings">Siblings</button>
                <button id="meta_button_wanted_notes">Wanted notes</button>
                <button id="meta_button_properties">Properties</button>
                <button id="meta_button_tags">Tags</button>
                <button id="meta_button_collections" onclick="showWindow()">Collections</button>

                <h3>Workflow</h3>

                <button id="meta_button_alert">Alerts</button>
                <button id="meta_button_flags">Flags</button>
                <button id="meta_button_projects">Projects</button>
                <button id="meta_button_tasks">Tasks</button>
                <button id="meta_button_pinned_notes">Pinned notes</button>


                <h3>Navigation</h3>
                <button id="meta_button_visited">Visited</button>
                <button id="meta_button_history">History</button>

            </div>
        </div>
    </div>

    <!-- Subnotes -->
    <div class="panel subnotes" id="panel_subnotes">


        <div class="panel-header">
        <span class="panel_title">
          <span id="children_label">Subnotes</span>


      <button class="add" id="children_button_add">Add</button>
        </span>

            <div>

                <button class="toggle_button" id="collapsible-toggle-children"
                        onclick="togglePanel(this, 'subnotes-content')">▼ Collapse
                </button>
            </div>
        </div>


        <div>


        </div>
        <div id="subnotes-content" class="collapsible-content">
            <ul id="children_ul">

                <li id="children_li_example">#<span class="children_child_id" id="children_child_4689_id">4689</span>
                    <a href="#" id="children_child_4689_title">Child 1</a>
                    <button id="children_child_4689_button_copy">Copy</button>
                </li>
            </ul>
        </div>
    </div>
</div>

<!-- Modal (Collections window) -->
<div id="window_container" class="window_container">
    <div class="window_container-header">
        <span id="window_container_title">Window Title</span>
        <button class="window_container_close" title="Close window" onclick="closeWindow()">X</button>
    </div>
    <div id="window_container_content"><p>Window content</p></div>
</div>

</body>
</html>
