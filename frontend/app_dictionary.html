<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dictionary - App</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="github.min.css">
    <link rel="stylesheet" href="app_dictionary.css">
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">

    <script src="highlight.min.js"></script>
    <script src="markdown-it.min.js"></script>
    <script src="markdown-it-emoji.min.js"></script>
    <script type="module" src="common.js"></script>
    <script type="module" src="app_dictionary.js"></script>
    <style>

    </style>
</head>
<body>
<div class="container">
    <header>
        <div id="dictionary_header" onclick="window.location.href='app_dictionary.html'">📚 Dictionary</div>
        <button id="button_mindnet">🌐 Mind Net</button>
    </header>

    <!-- Select Map -->
    <label for="select_map">🗺️ Map:</label>
    <select id="select_map">
<!--        <option value="1">Concurrency</option>-->
<!--        <option value="2">Parallelism</option>-->
<!--        <option value="3">Synchronization</option>-->
    </select>
    <br>
    <button id="button_add_map">➕ Add Map</button>

    <label for="input_search_term">🔍 Search term:</label>
    <input type="text" id="input_search_term" placeholder="Start writing..."/>
    <button id="button_add_term">➕ Add Term</button>


    <div id="term_container" style="margin-top:30px">
        <!-- Input for term -->
        <h2 id="term_container_h2">Term #123</h2>

        <label for="input_title">✍ Title:</label>
        <input type="text" id="input_title">

        <label for="input_disambiguation">🌀 Disambiguation:</label>
        <input type="text" id="input_disambiguation" placeholder="Start writing..."/>

        <label for="textarea_definition" style="margin-right:20px; display: inline;white-space: nowrap;">📖 Definition:</label>
        <button id="button_edit_definition">✏️ Edit</button>
        <button id="button_read_definition">📖 Read</button>
        <textarea id="textarea_definition"></textarea>

        <fieldset>
            <legend>⭐ Difficulty:</legend>

            <input id="input_difficulty_easy" type="radio" name="difficulty" value="1"><label for="input_difficulty_easy">Easy</label>
            <input id="input_difficulty_medium" type="radio" name="difficulty" value="2" checked="checked"><label for="input_difficulty_medium">Medium</label>
            <input id="input_difficulty_hard" type="radio" name="difficulty" value="3"><label for="input_difficulty_hard">Hard</label>
        </fieldset>


        <button id="button_delete_term" class="delete-btn">Delete</button>
            <!-- Save -->
        <button id="button_save_term" class="save-btn">Save</button>

        <br>
        <button id="button_show_backlinks">🔁 Backlinks</button>
        <button id="button_show_visited">👣 Visited</button>

        <!-- Tags -->
        <label>🏷️ Tags:</label>
        <div id="tags" class="tags">
            <div class="tag">Multithreading
                <button>&times;</button>
            </div>
            <div class="tag">Performance
                <button>&times;</button>
            </div>
        </div>
        <button id="button_add_tag" class="tags_add_btn">➕ Add Tag</button>

        <!-- Links -->
        <label>🔗 Links:</label>
        <div class="link-item">
            <a href="#">Thread Safety</a>
            <button>🗑️ Delete</button>
        </div>
        <div class="link-item">
            <a href="#">Race Conditions</a>
            <button>🗑️ Delete</button>
        </div>
        <div class="link-item">
            <a href="#">Deadlocks</a>
            <button>🗑️ Delete</button>
        </div>
        <button id="button_add_link">➕ Add Link</button>

        <!-- Notes -->
        <label>Notes 📑</label>
        <div class="note-item">
            <span>Advantages</span>
            <button>🗑️ Delete</button>
        </div>
        <div class="note-item">
            <span>Disadvantages</span>
            <button>🗑️ Delete</button>
        </div>
        <div class="note-item">
            <span>Best Practices</span>
            <button>🗑️ Delete</button>
        </div>
        <button id="button_add_note">➕ Add Note</button>
    </div>
    <div id="window_container" class="window_container">
        <header class="window_container-header">

            <span id="window_container_title">Window title</span>
            <button onclick="closeWindow()">✖</button>
        </header>
        <div id="window_container_content"><p>Window content</p></div>

    </div>
</div>
</body>
</html>
