 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🧠 Mind Net</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
    }

    header {
      background: #2c3e50;
      color: white;
      padding: 1rem;
    }

    nav {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    nav a {
      color: #ecf0f1;
      text-decoration: none;
      font-weight: bold;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      transition: background 0.3s;
    }

    nav a:hover {
      background: #34495e;
    }

    .submenu {
      background: #ecf0f1;
      padding: 0.5rem 1rem;
      display: flex;
      gap: 1rem;
      border-bottom: 1px solid #ccc;
      flex-wrap: wrap;
    }

    .submenu a {
      text-decoration: none;
      color: #2c3e50;
      font-weight: bold;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      transition: background 0.3s;
    }

    .submenu a:hover {
      background: #d0d0ff;
    }

    main {
      padding: 2rem;
    }

    .entity-title {
      margin-bottom: 1rem;
      font-size: 1.5rem;
      color: #2c3e50;
    }

    .content-area {
      background: white;
      border-radius: 6px;
      padding: 1rem;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      min-height: 200px;
      transition: all 0.3s ease;
    }

    .content-area.empty {
      opacity: 0.6;
      font-style: italic;
      color: #888;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th, td {
      padding: 0.8rem;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #3498db;
      color: white;
    }

    tr:hover {
      background: #f0f8ff;
    }

    .actions a {
      margin-right: 0.5rem;
      color: #3498db;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>🧠 Mind Net</h1>
    <nav id="entityNav">
      <!-- Entity links will be injected here -->
    </nav>
  </header>

  <div class="submenu" id="crudMenu">
    <!-- CRUD actions will be injected here -->
  </div>

  <main>
    <div class="entity-title" id="entityTitle">Select an entity to begin</div>
    <div class="content-area empty" id="contentArea">No action selected.</div>
  </main>

  <script>
    const entities = [
      'Map', 'Node', 'Content', 'Node Property',
      'Tag', 'Node Tag', 'Node Link', 'External Link'
    ];

    const actions = ['➕ Create', '📖 Read', '✏️ Update', '🗑️ Delete', '📋 List', '🔍 Search'];

    let selectedEntity = null;

    const entityNav = document.getElementById('entityNav');
    const crudMenu = document.getElementById('crudMenu');
    const entityTitle = document.getElementById('entityTitle');
    const contentArea = document.getElementById('contentArea');

    // Render entity navigation
    entities.forEach(entity => {
      const link = document.createElement('a');
      link.href = '#';
      link.textContent = entity;
      link.onclick = () => {
        selectedEntity = entity;
        entityTitle.textContent = `${entity} – Choose an action`;
        contentArea.classList.add('empty');
        contentArea.innerHTML = 'No action selected.';
        renderCrudMenu();
      };
      entityNav.appendChild(link);
    });

    // Render CRUD submenu
    function renderCrudMenu() {
      crudMenu.innerHTML = '';
      actions.forEach(action => {
        const link = document.createElement('a');
        link.href = '#';
        link.textContent = action;
        link.onclick = () => {
          contentArea.classList.remove('empty');
          contentArea.innerHTML = `<h3>${action} ${selectedEntity}</h3><p>Form or data will appear here.</p>`;
        };
        crudMenu.appendChild(link);
      });
    }
  </script>

</body>
</html>
