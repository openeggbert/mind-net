<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Repetition</title>
    <link rel="stylesheet" href="app_repetition.css">
    <script type="module" src="app_repetition.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body>
<div id="app" data-version="rich"></div>
<div id="loading_screen" style="display:none">Loading…</div>
<div id="slip_box">

    <header>
        <div id="repetition_header" onclick="window.location.href='app_repetition_header.html'">🔁 Repetiton</div>
        <button id="button_mindnet">🌐 Mind Net</button>
        <button id="button_sessions">Sessions →</button>
        <button id="button_settings" class="focus">Settings</button>
        <button id="button_theme">🌓 Toggle Theme</button>
    </header>

    <main id="main">

        <h2>SM-18 Zkoušení</h2>

        <div class="card">
            <div class="front">❓ Co znamená <code>const</code> u parametru funkce v C++?</div>
            <div class="back">✅ Označuje, že parametr nebude uvnitř funkce měněn.</div>
            <button class="show-btn" onclick="showAnswer()">Zobrazit odpověď</button>
            <div id="rating">
                <p>Jak dobře sis poznámku vybavil?</p>
                <div>
                    <button class="rating-btn" onclick="rate(0)">0</button>
                    <button class="rating-btn" onclick="rate(1)">1</button>
                    <button class="rating-btn" onclick="rate(2)">2</button>
                    <button class="rating-btn" onclick="rate(3)">3</button>
                    <button class="rating-btn" onclick="rate(4)">4</button>
                    <button class="rating-btn" onclick="rate(5)">5</button>
                </div>
            </div>
            <div class="info" id="result"></div>
        </div>

    </main>

    <div id="window_container" class="window_container">
        <header class="window_container-header">

            <span id="window_container_title">Window title</span>
            <button onclick="closeWindow()">✖</button>
        </header>
        <div id="window_container_content"><p>Window content</p></div>

    </div>

</div>

</body>
</html>
